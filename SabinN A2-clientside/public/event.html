<!DOCTYPE html>
<html>
<head>
    <title>Event Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/search">Search Events</a>
    </nav>

    <div class="container" id="detail">
        <p>Loading...</p>
    </div>

    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
        <div style="background:white; padding:2rem; border-radius:8px; text-align:center; margin:15% auto; max-width:400px;">
            <p>This feature is currently under construction.</p>
            <button onclick="document.getElementById('modal').style.display='none'">Close</button>
        </div>
    </div>

<script>
const API_BASE = "http://localhost:3060/api/events";

//parse the query string manually (vanilla JS - no URLSearchParams)
function parseQueryString(qs) {
    const result = {};
    if (!qs) return result;
    const pairs = qs.substring(1).split('&');
    pairs.forEach(pair => {
        const kv = pair.split('=');
        result[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
    return result;
}

//get event id from URL query string
const params = parseQueryString(window.location.search);
const eventId = params.id;
const container = document.getElementById('detail');

if (!eventId) {
    container.innerHTML = '<p class="error">No event selected.</p>';
} else {
    //call GET API with parameter
    fetch(API_BASE + "/" + eventId)
    .then(response => response.json())
    .then(event => {
        if (event.error) {
            throw new Error(event.error);
        }

        //calculate progress percentage
        let pct = 0;
        if (event.goal_amount > 0) {
            pct = Math.min(100, (event.raised_amount / event.goal_amount) * 100).toFixed(1);
        }

        container.innerHTML =
            '<h1>' + event.event_name + '</h1>' +
            '<span class="badge ' + event.event_state.toLowerCase() + '">' + event.event_state + '</span>' +
            '<img src="' + event.image_url + '" style="width:100%; max-height:340px; object-fit:cover; border-radius:8px; margin:1rem 0;">' +
            '<h2>' + event.category_name + ' - hosted by ' + event.org_name + '</h2>' +
            '<p><strong>Date:</strong> ' + new Date(event.event_date).toLocaleString() + '</p>' +
            '<p><strong>Location:</strong> ' + event.location + '</p>' +
            '<p><strong>Purpose:</strong> ' + event.purpose + '</p>' +
            '<p><strong>Description:</strong> ' + event.description + '</p>' +
            '<p><strong>Ticket Price:</strong> $' + Number(event.ticket_price).toFixed(2) + '</p>' +
            '<h3>Fundraising Progress</h3>' +
            '<div class="progress"><div style="width:' + pct + '%">' + pct + '%</div></div>' +
            '<p>Raised $' + Number(event.raised_amount).toFixed(2) + ' of $' + Number(event.goal_amount).toFixed(2) + ' goal</p>' +
            '<p><strong>Contact:</strong> ' + event.email + ' | ' + event.phone + '</p>' +
            '<button id="registerBtn" style="margin-top:1rem;">Register</button>';

        //attach event listener to Register button
        document.getElementById('registerBtn').addEventListener('click', function() {
            document.getElementById('modal').style.display = 'block';
        });
    })
    .catch(error => {
        console.error("Error fetching data", error);
        container.innerHTML = '<p class="error">' + error.message + '</p>';
    });
}
</script>
</body>
</html>
